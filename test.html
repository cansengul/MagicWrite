<!-- Capture beforeinstallprompt as early as possible (it fires once, early
     in the page lifecycle). Stored globally so the install-modal IIFE can
     read it regardless of when it runs. -->
<script>
/* ── iOS PWA KEYBOARD AVOIDANCE ───────────────────────────────────────────
   On iOS in standalone mode the layout viewport never shrinks when the
   software keyboard opens, so fixed elements and bottom bars get covered.
   We use visualViewport to measure the exposed height and set --keyboard-h,
   which CSS uses to shrink #shell and shift fixed modals upward.
   This runs ONLY on resize events – not on page load – so it cannot
   trigger the bottom-bar bug (which needs the initial dvh calc to be stable).
   ───────────────────────────────────────────────────────────────────────── */
(function(){
  if(!window.visualViewport) return;
  var vv = window.visualViewport;
  var root = document.documentElement;
  var ticking = false;

  function applyKeyboardHeight(){
    ticking = false;
    // keyboard height = gap between layout viewport bottom and visual viewport bottom
    var kh = Math.max(0, window.innerHeight - vv.offsetTop - vv.height);
    root.style.setProperty('--keyboard-h', kh + 'px');
  }

  function schedule(){
    if(!ticking){
      ticking = true;
      requestAnimationFrame(applyKeyboardHeight);
    }
  }

  vv.addEventListener('resize', schedule, { passive: true });
  vv.addEventListener('scroll', schedule, { passive: true });
})();
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  window._mwDeferredPrompt = e;
});
window.addEventListener('appinstalled', function(){
  window._mwDeferredPrompt = null;
  localStorage.setItem('mw-install-shown','1');
});
</script>

// ── FIREBASE ANALYTICS ──────────────────────────────────────
// Session tracking for user interactions
var _analytics = null;
var _sessionId = 'mw_' + Date.now() + '_' + Math.random().toString(16).slice(2, 10);
var _appStartTs = Date.now();

function logAnalyticsEvent(name, params) {
  if (!_analytics) return;
  var payload = Object.assign({ session_id: _sessionId }, params || {});
  try {
    _analytics.logEvent(name, payload);
  } catch (e) {
    console.warn('[Analytics] logEvent failed:', e);
  }
}

function initAnalytics() {
  if (!window.firebase) {
    console.warn('[Analytics] Firebase SDK not loaded');
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    _analytics = firebase.analytics();
    
    // Log app start
    logAnalyticsEvent('app_start', {
      pwa_mode: window.matchMedia('(display-mode: standalone)').matches ? 'yes' : 'no',
      theme: document.documentElement.getAttribute('data-theme') || 'auto',
      device: /android|iphone|ipad|mobile/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
    });
    
    // Log app ready after brief delay
    window.setTimeout(function () {
      logAnalyticsEvent('app_ready', { ready_ms: Date.now() - _appStartTs });
    }, 400);
  } catch (e) {
    console.error('[Analytics] Init failed:', e);
  }
}

// UI Event Tracking
function setupAnalyticsTracking() {
  // Track button clicks
  document.addEventListener('click', function (event) {
    var target = event.target;
    if (!target) return;
    
    var el = target.closest('button, .btn, .hbtn, .tbtn, .page-nav-btn, .zoom-btn, .smodal-btn, .fmt-btn, .exp-item, .user-menu-item');
    if (!el) return;
    
    var text = (el.textContent || '').trim().slice(0, 80);
    logAnalyticsEvent('ui_click', {
      element: text || el.id || el.className || 'unknown'
    });
  }, true);
  
  // Track text input
  var txt = document.getElementById('txt');
  if (txt) {
    var inputTimeout;
    txt.addEventListener('input', function () {
      clearTimeout(inputTimeout);
      inputTimeout = window.setTimeout(function () {
        logAnalyticsEvent('text_input', {
          text_length: txt.value.length
        });
      }, 1000);
    });
  }
  
  // Track theme changes
  var observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (mutation) {
      if (mutation.attributeName === 'data-theme') {
        logAnalyticsEvent('theme_changed', {
          theme: document.documentElement.getAttribute('data-theme') || 'auto'
        });
      }
    });
  });
  
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['data-theme']
  });
}

// Initialize analytics on load
